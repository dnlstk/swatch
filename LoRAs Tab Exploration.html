/* ══ LORA CARD ════════════════════════════════════ */
// All elements float over the image — no solid bar below
const LoraCard = ({p, name, type, status, fav, enabled, adult=false, g=0, imgSrc=null}) => {
  const [c1,c2] = GRADS[g % GRADS.length];
  const tc = (p.mode==='light' ? TYPE_L : TYPE_D)[type] || p.muted;
  const sc = STATUS_C[status] || p.muted;
  return (
    <div style={{borderRadius:10,overflow:'hidden',border:`1.5px solid ${enabled?p.orange+'88':tc+'33'}`,position:'relative',aspectRatio:'2/3',cursor:'pointer',boxShadow:enabled?`0 0 0 1px ${p.orange}22,inset 0 0 0 1px ${p.orange}11`:'none'}}>
      {/* Background */}
      {imgSrc
        ? <img src={imgSrc} style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',objectPosition:'top'}} />
        : <>
            <div style={{position:'absolute',inset:0,background:`linear-gradient(160deg,${c1},${c2})`}} />
            <div style={{position:'absolute',inset:0,background:'repeating-linear-gradient(45deg,rgba(255,255,255,0.018) 0,rgba(255,255,255,0.018) 1px,transparent 0,transparent 14px)'}} />
          </>
      }
      {/* Gradient overlay — bottom 68% */}
      <div style={{position:'absolute',bottom:0,left:0,right:0,height:'68%',background:'linear-gradient(to top,rgba(0,0,0,0.94) 0%,rgba(0,0,0,0.55) 40%,transparent 100%)'}} />
      {/* Status — square pill top left */}
      <div style={{position:'absolute',top:7,left:7,padding:'2px 7px',borderRadius:5,background:sc,display:'flex',alignItems:'center',justifyContent:'center'}}>
        <span style={{fontFamily:'Space Mono',fontSize:9,color:'#fff',fontWeight:700,lineHeight:1}}>{status==='verified'?'✓':status==='testing'?'T':'✗'}</span>
      </div>
      {/* Top-right: adult ⍜ + fav ★ */}
      <div style={{position:'absolute',top:6,right:7,display:'flex',gap:5,alignItems:'center'}}>
        {adult && <span style={{fontSize:12,color:'rgba(167,139,250,0.95)',textShadow:'0 0 6px rgba(0,0,0,0.8)'}}>⍜</span>}
        <span style={{fontSize:14,color:fav?'#FFD700':'rgba(255,255,255,0.2)',textShadow:fav?'0 0 6px rgba(255,215,0,0.5)':'none'}}>★</span>
      </div>
      {/* Name + type + P — sits above enable bar */}
      <div style={{position:'absolute',bottom:36,left:8,right:8}}>
        <div style={{fontSize:11,fontWeight:500,color:'#fff',lineHeight:1.3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginBottom:4,textShadow:'0 1px 6px rgba(0,0,0,0.7)'}}>{name}</div>
        <div style={{display:'flex',alignItems:'center',gap:5}}>
          <span style={{fontFamily:'Space Mono',fontSize:8,padding:'2px 7px',borderRadius:5,background:`${tc}66`,color:tc,border:`1px solid ${tc}88`,letterSpacing:'0.04em'}}>{type}</span>
          <span style={{fontFamily:'Space Mono',fontSize:7,padding:'2px 5px',borderRadius:4,background:'rgba(255,255,255,0.14)',color:'rgba(255,255,255,0.65)',border:'1px solid rgba(255,255,255,0.22)',lineHeight:1}}>P</span>
        </div>
      </div>
      {/* Enable + i — floating bar at very bottom */}
      <div style={{position:'absolute',bottom:0,left:0,right:0,display:'flex',gap:4,padding:'5px',background:'rgba(0,0,0,0.62)'}}>
        <button style={{flex:1,padding:'5px 0',borderRadius:5,border:`1px solid ${enabled?p.orange+'88':'rgba(255,255,255,0.2)'}`,background:enabled?`${p.orange}44`:'rgba(255,255,255,0.07)',color:enabled?p.orange:'rgba(255,255,255,0.75)',fontFamily:'Space Mono',fontSize:9,letterSpacing:'0.04em',cursor:'pointer'}}>{enabled?'Enabled':'Enable'}</button>
        <button style={{width:26,height:26,borderRadius:5,border:'1px solid rgba(255,255,255,0.2)',background:'rgba(255,255,255,0.07)',color:'rgba(255,255,255,0.7)',fontSize:11,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Space Mono',flexShrink:0}}>i</button>
      </div>
    </div>
  );
};
